spring:
  application:
    name: ai-review
  profiles:
    include: secret
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.example.aireview.domain
  configuration:
    map-underscore-to-camel-case: true
